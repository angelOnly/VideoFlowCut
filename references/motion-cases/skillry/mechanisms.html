<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>按运动机制查找</title><link rel="stylesheet" href="catalogue.css"><style>
.mechanism-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
