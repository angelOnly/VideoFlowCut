# 本项目的 Codex 本地接入配置。项目被信任并重新加载后，Codex 会启动同仓库的 MCP。
[mcp_servers."video-editor-mcp"]
command = "npm"
args = ["run", "mcp"]
startup_timeout_sec = 20
tool_timeout_sec = 120
enabled = true
default_tools_approval_mode = "writes"

# 显式登记项目 Skills，避免依赖宿主对目录扫描规则的隐式假设。
[[skills.config]]
path = "../.agents/skills/project-basics"
enabled = true

[[skills.config]]
path = "../.agents/skills/web-editor-operator"
enabled = true

[[skills.config]]
path = "../.agents/skills/production-director"
enabled = true

[[skills.config]]
path = "../.agents/skills/asset-import"
enabled = true

[[skills.config]]
path = "../.agents/skills/transcription"
enabled = true

[[skills.config]]
path = "../.agents/skills/voice-production"
enabled = true

[[skills.config]]
path = "../.agents/skills/presenter-motion-director"
enabled = true

[[skills.config]]
path = "../.agents/skills/captions"
enabled = true

[[skills.config]]
path = "../.agents/skills/quality-verification"
enabled = true

[[skills.config]]
path = "../.agents/skills/export"
enabled = true

[[skills.config]]
path = "../.agents/skills/known-errors"
enabled = true

# 阶段一已具备规划、有限写入或真实预览验证能力的专业 Skill。
[[skills.config]]
path = "../.agents/skills/semantic-continuity"
enabled = true

[[skills.config]]
path = "../.agents/skills/visual-treatment-planning"
enabled = true

[[skills.config]]
path = "../.agents/skills/effect-timing"
enabled = true

[[skills.config]]
path = "../.agents/skills/depth-composition"
enabled = true

[[skills.config]]
path = "../.agents/skills/cutaway-planning"
enabled = true

[[skills.config]]
path = "../.agents/skills/scene-planning"
enabled = true

[[skills.config]]
path = "../.agents/skills/remotion-production"
enabled = true

# 阶段一已经包含原声、Dialogue、停顿与导出音轨，声音收口必须纳入专业判断。
[[skills.config]]
path = "../.agents/skills/audio-finishing"
enabled = true
