<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<title>旧书交换活动：布局草图，无真实素材</title>
<rect width="1600" height="1000" fill="#E7E9E3"/>
<text x="64" y="53" font-family="Microsoft YaHei UI" font-size="22" fill="#344C42">布局草图 · 文字与画面位置试排 · 无真实素材</text>
<g transform="translate(0,100)">
<rect width="1600" height="900" fill="#F3F0E8"/>
<rect x="645" y="78" width="885" height="744" fill="#D7DFD0"/>
<path d="M 645 78 L 1530 822 M 1530 78 L 645 822" stroke="#AFBFAA" stroke-width="2"/>
<rect x="920" y="370" width="338" height="128" fill="#D7DFD0"/>
<text x="1088" y="420" text-anchor="middle" font-family="Microsoft YaHei UI" font-size="30" fill="#47614F">画面占位</text>
<text x="1088" y="466" text-anchor="middle" font-family="Microsoft YaHei UI" font-size="22" fill="#47614F">真实素材待选</text>
<rect x="88" y="258" width="54" height="8" fill="#C66F45"/>
