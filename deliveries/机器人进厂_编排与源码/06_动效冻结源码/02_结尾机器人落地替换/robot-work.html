 const load=carrying?`<path d="M-87 18H87L75 91H-75Z" fill="#287c81" stroke="#8cd7cf" stroke-width="4"/><path d="M-87 18L-64 2H63L87 18Z" fill="#184a57"/>`+part(0,11,0,.46)+`<path d="M-87 24V38H87V24" fill="none" stroke="#8cd7cf" stroke-width="6"/><path d="M-81 39V60M81 39V60" stroke="#bed2da" stroke-width="16"/>`:'';
