<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>后空翻之后，机器人怎样进工厂</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#101820}
#film{position:relative;isolation:isolate;width:1920px;height:1080px;overflow:hidden;background:#101820;color:#ece8dc;font-family:var(--vfc-font-title),sans-serif}
.shot{position:absolute;display:none;overflow:hidden;background:#101820}
.shot img{display:block;width:100%;height:100%;object-fit:cover}
.shot.detail img{position:absolute;width:165%;height:135%;left:-57.5%;top:-10%}
.shot.clean img{position:absolute;width:115%;height:115%;left:-4%;top:0}
.ink{position:absolute;display:none}
#shade{pointer-events:none;background:radial-gradient(ellipse 350px 255px at 45% 34%,transparent 52%,rgba(8,14,19,.72) 96%)}
#focus{width:492px;height:312px;border:3px solid #ff9950;border-radius:50%;box-shadow:0 0 0 10px #ff99501a;pointer-events:none}
#scan{width:348px;height:3px;background:#ff9950;box-shadow:0 0 14px #ff9950;pointer-events:none}
#ink-label{padding:15px 23px;border-left:5px solid #ff9950;background:#101820ed;font-size:39px;line-height:1.38;white-space:pre-line}
#metric{width:480px;padding:34px 38px;border-left:3px solid #ff9950;background:#17232d}
#metric-label{font-size:28px;color:#e9dfcd;line-height:1.38;white-space:pre-line}
#metric-value{font-size:105px;color:#ff9950;line-height:1.12;letter-spacing:-4px;white-space:nowrap}
#metric-foot{font-size:30px;line-height:1.35;white-space:pre-line}
#events{display:none;margin-top:23px;grid-template-columns:repeat(10,12px);gap:9px}
#events i{display:block;width:12px;height:12px;border:1.5px solid #ff9950;border-radius:50%}
</style>
</head>
<body>
<main id="film" data-composition-id="film" data-start="0" data-width="1920" data-height="1080" data-duration="115.26666666666667">
<div class="shot" id="shot-air"><img id="video-air" data-vfc-video-slot="air" alt=""></div>
<div class="shot clean" id="shot-rack"><img id="video-rack" data-vfc-video-slot="rack" alt=""></div>
<div class="shot" id="shot-bin"><img id="video-bin" data-vfc-video-slot="bin" alt=""></div>
<div class="shot detail" id="shot-regrip"><img id="video-regrip" data-vfc-video-slot="regrip" alt=""></div>
<div class="shot" id="shot-bin2"><img id="video-bin2" data-vfc-video-slot="bin2" alt=""></div>
<div class="shot" id="shot-bmw"><img id="video-bmw" data-vfc-video-slot="bmw" alt=""></div>
<div class="shot" id="shot-loop"><img id="video-loop" data-vfc-video-slot="loop" alt=""></div>
<div class="shot" id="shot-loop2"><img id="video-loop2" data-vfc-video-slot="loop2" alt=""></div>
<div class="shot" id="shot-cycle1"><img id="video-cycle1" data-vfc-video-slot="cycle1" alt=""></div>
<div class="shot" id="shot-cycle2"><img id="video-cycle2" data-vfc-video-slot="cycle2" alt=""></div>
<div class="shot" id="shot-cycle3"><img id="video-cycle3" data-vfc-video-slot="cycle3" alt=""></div>
<div class="shot detail" id="shot-align"><img id="video-align" data-vfc-video-slot="align" alt=""></div>
<div class="shot" id="shot-line"><img id="video-line" data-vfc-video-slot="line" alt=""></div>
<div class="shot" id="shot-stable"><img id="video-stable" data-vfc-video-slot="stable" alt=""></div>
<div class="shot" id="shot-fixed"><img id="video-fixed" data-vfc-video-slot="fixed" alt=""></div>
<div class="shot" id="shot-fixedEnd"><img id="video-fixedEnd" data-vfc-video-slot="fixedEnd" alt=""></div>
<div class="shot" id="shot-pickWindow"><img id="video-pickWindow" data-vfc-video-slot="pickWindow" alt=""></div>
<div class="shot" id="shot-aisle"><img id="video-aisle" data-vfc-video-slot="aisle" alt=""></div>
<div class="shot" id="shot-adapt"><img id="video-adapt" data-vfc-video-slot="adapt" alt=""></div>
<div class="shot" id="shot-carrying"><img id="video-carrying" data-vfc-video-slot="carrying" alt=""></div>
<div class="shot" id="shot-shift"><img id="video-shift" data-vfc-video-slot="shift" alt=""></div>
<div class="shot" id="shot-shiftEnd"><img id="video-shiftEnd" data-vfc-video-slot="shiftEnd" alt=""></div>
<div class="shot" id="shot-reprise"><img id="video-reprise" data-vfc-video-slot="reprise" alt=""></div>
<div class="shot detail" id="shot-holder"><img id="video-holder" data-vfc-video-slot="holder" alt=""></div>
<div class="shot" id="shot-next"><img id="video-next" data-vfc-video-slot="next" alt=""></div>
<div class="ink" id="shade"></div>
<div class="ink" id="focus"></div>
<div class="ink" id="scan"></div>
<div class="ink" id="ink-label"></div>
<div class="ink" id="metric"><div id="metric-label"></div><div id="metric-value"></div><div id="metric-foot"></div><div id="events"></div></div>
</main>
<script>
(() => {
  const byId = id => document.getElementById(id);
  const shots = new Map(["air","rack","bin","regrip","bin2","bmw","loop","loop2","cycle1","cycle2","cycle3","align","line","stable","fixed","fixedEnd","pickWindow","aisle","adapt","carrying","shift","shiftEnd","reprise","holder","next"].map(id => [id, byId('shot-' + id)]));
  const ink = ['shade', 'focus', 'scan', 'ink-label', 'metric'].map(byId);
  const dotGrid = byId('events');
  const dots = Array.from({length:100}, () => document.createElement('i'));
  dotGrid.append(...dots);
  const clock = {frame:0};
  const root = [0,0,1920,1080];
  const side = [45,145,1250,704];
  const show = (id, box = root, layer = 1, border = false, alpha = 1) => {
    const node = shots.get(id) || byId(id);
    const [x,y,w,h] = box;
    Object.assign(node.style, {display:'block', left:x+'px', top:y+'px', width:w+'px', height:h+'px',
      zIndex:String(layer), opacity:String(alpha), outline:border?'3px solid #ff9950':'none'});
    return node;
  };
  const progress = (frame,start,end) => {
    const x = Math.min(1,Math.max(0,(frame-start)/(end-start)));
    return x*x*(3-2*x);
  };
  const move = (from,to,t) => from.map((v,i) => v+(to[i]-v)*t);
  const caption = (text,x,y,width=0) => {
    const node = show('ink-label',[x,y,width||450,0],22);
    node.style.height='auto';
    node.textContent=text;
  };
  const metric = (label,value,foot,visibleDots=0) => {
    const node = show('metric',[1380,227,480,0],22);
    node.style.height='auto';
    byId('metric-label').textContent=label;
    byId('metric-value').textContent=value;
    byId('metric-foot').textContent=foot;
    dotGrid.style.display=visibleDots?'grid':'none';
    dots.forEach((dot,i) => { dot.style.opacity=i<visibleDots?'0.95':'0.08'; });
  };
  const update = () => {
    const f = Math.min(3457, Math.max(0, Math.round(clock.frame)));
    [...shots.values(),...ink].forEach(node => { node.style.display='none'; });
    if(f<202){
      show('air');
      if(f>=161)show('rack',move([1300,660,390,220],root,progress(f,177,202)),3,f<197);
      return;
    }
    if(f<338){show('rack');return;}
    if(f<437){show('bin');return;}
    if(f<853){
      const small=[75,170,1165,656];
      const t=progress(f,550,600);
      show('regrip',move(root,small,t),3,t>0.55);
      if(f>=509&&f<550){
        show('shade',root,7);
        show('focus',[585,196,542,304],8,false,progress(f,509,520));
      }
      if(f>=566&&f<622){
        show('scan',[410,390+125*progress(f,566,622),270,3],9,false,1-progress(f,607,622));
      }
      if(f>=605)caption(f<720?'发现位置变化':'重新对位',1324,406,465);
      return;
    }
    if(f<949){show('bin2');return;}
    if(f<1087){
      show('bmw',move(root,[695,183,1152,648],progress(f,949,971)),3,f>=960);
      if(f>=974)caption('从识别位置\n到重新对位',90,442,493);
      return;
    }
    if(f<1406){
      const entering=progress(f,1087,1113);
      show(f<1279?'loop':'loop2',move(root,side,entering),1);
      if(f>=1110&&f<1283){
        metric('假设 · 单次成功率','99%',f>=1180?'各次结果互不影响':'每次结果互不影响');
      }
      if(f>=1283){
        const list=['cycle1','cycle2','cycle3'];
        list.forEach((id,i)=>{
          if(f>=1283+i*8)show(id,[45+i*420,843,400,179],5,true,progress(f,1283+i*8,1293+i*8));
        });
        if(f<1333){
          metric('各次结果独立','100 次','全部成功的概率',Math.min(100,Math.round((f-1282)*3)));
        }else{
          metric('连续 100 次全部成功','≈37%','各次结果独立（假设）\n0.99¹⁰⁰ ≈ 36.6%');
        }
      }
      return;
    }
    if(f<1663){
      if(f<1575)show('align',move(root,[56,154,1190,669],progress(f,1538,1557)),1);
      if(f>=1538)show('line',move([1310,243,550,309],root,progress(f,1560,1580)),5,f<1576);
      if(f<1533)caption('自动恢复',85,167,380);
      else if(f>=1556)caption('若需人工 · 下游示意',1250,133,590);
      return;
    }
    if(f<1871){
      show('stable',move(root,side,progress(f,1663,1693)),1);
      if(f>=1690)caption(f<1757?'长时间稳定':f<1805?'处理异常':'人员介入',1377,425,457);
      return;
    }
    if(f<2256){
      show(f<2234?'fixed':'fixedEnd');
      if(f>=1949&&f<2208)caption(f<2065?'来料路径':f<2145?'固定接位':'下一轮',81,145,388);
      if(f>=2065&&f<2234){
        const enter=progress(f,2065,2082);
        const exit=progress(f,2208,2234);
        show('pickWindow',move([1490,715,315,177],[1205,528,646,363],enter),5,true,enter*(1-exit));
      }
      return;
    }
    if(f<2420){show('aisle');return;}
    if(f<2585){
      show('adapt',move(root,[92,181,1195,672],progress(f,2495,2515)),1);
      if(f>=2495)show('carrying',move([1316,418,515,290],root,progress(f,2550,2585)),6,f<2577,progress(f,2495,2516));
      return;
    }
    if(f<2807){
      show('carrying');
      if(f>=2695)caption('累计搬运超过 10 万个料箱',91,139,777);
      return;
    }
    if(f<3060){
      show('shift');
      if(f>=2890)caption(f<2950?'更多任务':f<3007?'更多意外':'使用成本',83,153,463);
      return;
    }
    if(f<3075){show('shiftEnd');return;}
    if(f<3199){
      show('reprise');
      if(f>=3190)show('holder',move([1278,680,527,296],root,progress(f,3190,3208)),5,true);
      return;
    }
    if(f<3310){
      show('holder');
      if(f>=3300)show('next',move([1304,650,545,307],root,progress(f,3300,3320)),5,true);
      return;
    }
    show('next',move(root,[64,36,1792,1008],progress(f,3427,3458)));
  };
  const timeline = gsap.timeline({paused:true});
  timeline.to(clock,{frame:3458,duration:3458/30,ease:'none',onUpdate:update},0);
  window.__timelines = window.__timelines || {};
  window.__timelines.film = timeline;
  window.getVfcMotionEvents = () => [{id:'atlas-landing',meaning:'Atlas 双脚着地',startFrame:133,endFrame:145}];
  update();
})();
</script>
</body>
</html>
